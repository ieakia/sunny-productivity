<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sunny productivity 𖤓</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title-box">
                <h1>sunny productivity 𖤓</h1>
                <p class="subtitle">manage your daily tasks with a smile!</p>
            </div>
        </div>

        <div class="progress-section">
            <div class="progress-text">
                <span id="progress-label">0 of 0 completed</span>
                <span id="progress-percentage">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </div>
        
        <div class="input-section">
            <div class="input-group">
                <label for="todo-title">Task Title</label>
                <input type="text" id="todo-title" placeholder="Enter task title..." />
            </div>
            <div class="input-group">
                <label for="todo-description">Description</label>
                <textarea id="todo-description" placeholder="Enter task description..."></textarea>
            </div>
            <div class="button-group">
                <button id="add-btn" onclick="addTodo()">Add Task</button>
                <button class="cancel-btn" id="cancel-btn" onclick="cancelEdit()">Cancel</button>
            </div>
        </div>

        <ul class="todo-list" id="todo-list">
            <div class="empty-state">No tasks yet. Start adding some!</div>
        </ul>

    <footer class="footer">
    <p>© 2025 Yanni Akia Esguerra. Licensed under the <a href="https://opensource.org/licenses/MIT" target="_blank">MIT License</a>.</p>
    </footer>
    </div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <div class="modal-header">Delete Task</div>
            <div class="modal-body">Are you sure you want to delete this task? This action cannot be undone.</div>
            <div class="modal-actions">
                <button class="modal-btn modal-btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="modal-btn modal-btn-confirm" onclick="confirmDelete()">Delete</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
